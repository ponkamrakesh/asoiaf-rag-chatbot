name: Ingest ASOIAF to Pinecone

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Batch size for Pinecone upsert'
        required: false
        default: '200'
      max_pages:
        description: 'Max pages to parse (leave empty for all 4068 pages)'
        required: false
        default: ''
  push:
    paths:
      - 'data/got.pdf'

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf fastembed pinecone tqdm

      - name: Run Ingestion Pipeline
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME || 'asoiaf-books' }}
        run: |
          ARGS="--batch-size ${{ github.event.inputs.batch_size || 200 }}"
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            ARGS="$ARGS --max-pages ${{ github.event.inputs.max_pages }}"
          fi
          echo "Executing: python scripts/ingest.py $ARGS"
          python scripts/ingest.py $ARGS

